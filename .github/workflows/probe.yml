name: probe-toolchain

# 临时探测：确认 GitHub Runner 上哪条交叉编译路径可用。确认后会删掉本文件。
on: [push, workflow_dispatch]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 系统信息
        run: cat /etc/os-release | head -3

      - name: 探测各工具链来源可达性
        run: |
          for u in \
            "https://ziglang.org/download/index.json" \
            "https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz" \
            "https://musl.cc/" \
            "https://downloads.openwrt.org/" \
            "https://toolchains.bootlin.com/"
          do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 -L "$u" 2>/dev/null || echo "CURL-FAIL")
            echo "$code  $u"
          done

      - name: 安装 zig
        id: zig
        run: |
          set -e
          cd "$RUNNER_TEMP"
          if curl -fsSL --max-time 300 -o zig.tar.xz \
              "https://ziglang.org/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz"; then
            tar xf zig.tar.xz
            echo "$RUNNER_TEMP/zig-x86_64-linux-0.15.1" >> "$GITHUB_PATH"
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "zig 下载成功"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "zig 下载失败"
          fi

      - name: zig 版本与各目标 libc 可用性
        if: steps.zig.outputs.ok == '1'
        run: |
          zig version
          for t in x86_64-linux-musl aarch64-linux-musl \
                   mipsel-linux-musleabi mipsel-linux-musleabihf mips-linux-musleabi \
                   arm-linux-musleabihf arm-linux-musleabi; do
            printf '%-28s ' "$t"
            if zig libc -target "$t" >/dev/null 2>&1; then echo "libc 可用"; else echo "libc 不可用"; fi
          done

      - name: 试编译全部目标
        if: steps.zig.outputs.ok == '1'
        run: |
          for t in x86_64-linux-musl aarch64-linux-musl \
                   mipsel-linux-musleabi mipsel-linux-musleabihf mips-linux-musleabi \
                   arm-linux-musleabihf arm-linux-musleabi; do
            printf '%-28s ' "$t"
            if zig cc -target "$t" -static -Os -std=c99 -Wall -o "out-$t" lan_share.c 2>"err-$t.log"; then
              echo "OK  $(stat -c%s "out-$t") 字节  | $(file -b "out-$t")"
            else
              echo "失败:"
              head -8 "err-$t.log" | sed 's/^/      /'
            fi
          done

      - name: apt 交叉编译器可用性（备选方案）
        run: |
          sudo apt-get update -qq
          for p in gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf \
                   gcc-mipsel-linux-gnu gcc-mips-linux-gnu gcc-mips64el-linux-gnuabi64; do
            cand=$(apt-cache policy "$p" 2>/dev/null | awk '/Candidate:/{print $2}')
            echo "$p -> ${cand:-无此包}"
          done
