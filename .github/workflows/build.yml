name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Linux 目标用 zig 交叉编译：zig 自带 musl，-static 出来的二进制拷到
  # OpenWrt（musl 环境）直接可跑，不挑发行版。
  #
  # 不要从 GitHub Release 下 zig —— ziglang 从 0.14 起只把源码包放 GitHub，
  # 预编译二进制只在 ziglang.org，写成
  #   github.com/ziglang/zig/releases/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
  # 会 404。
  ZIG_VERSION: '0.15.1'

jobs:
  # ---------------------------------------------------------------- 功能测试
  test:
    name: 功能测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 编译
        run: cc -O2 -std=c99 -Wall -o lan-share lan_share.c

      - name: 检查可执行文件
        run: |
          ./lan-share -h || true
          ls -la lan-share

      # 测试脚本会自己拉起服务、跑完 38 项断言再关掉它
      - name: 运行端到端测试
        env:
          SPAWN: ./lan-share -p 8080 -d ./uploads -w ./public
          BASE: http://127.0.0.1:8080
          TRAVERSAL_PROBE: lan_share.c
        run: node test.js

  # ------------------------------------------------------------ 多平台编译
  build:
    name: 编译 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux_amd64
            os: ubuntu-latest
            kind: zig
            target: x86_64-linux-musl
            out: lan-share-linux-amd64

          - name: linux_arm64
            os: ubuntu-latest
            kind: zig
            target: aarch64-linux-musl
            out: lan-share-linux-arm64

          # OpenWrt 32 位 ARM 硬浮点：BCM27xx、i.MX6、大多数现代 ARM 路由器。
          # 与桌面 ARMv8 区分开单独出一份，因为路由器普遍是 32 位 userspace。
          - name: openwrt_armv7l
            os: ubuntu-latest
            kind: zig
            target: arm-linux-musleabihf
            out: lan-share-openwrt-armv7l

          - name: windows_amd64
            os: windows-latest
            kind: msys2
            out: lan-share-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - name: 安装 zig ${{ env.ZIG_VERSION }}
        if: matrix.kind == 'zig'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL --max-time 300 -o zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar xf zig.tar.xz
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: 安装 MinGW (Windows)
        if: matrix.kind == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: false

      - name: 编译 (Windows)
        if: matrix.kind == 'msys2'
        shell: msys2 {0}
        run: |
          gcc -Os -std=c99 -Wall -static \
            -o "${{ matrix.out }}" lan_share.c -lws2_32
          file "${{ matrix.out }}"
          ls -la "${{ matrix.out }}"

      - name: 编译 (Linux / OpenWrt，zig + musl 静态)
        if: matrix.kind == 'zig'
        run: |
          set -e
          zig version
          zig cc -target "${{ matrix.target }}" -static -Os -std=c99 -Wall \
            -o "${{ matrix.out }}" lan_share.c
          file "${{ matrix.out }}" 2>/dev/null || true
          ls -la "${{ matrix.out }}"
          # 静态产物不应再依赖动态链接器，否则拷到 OpenWrt 上跑不起来
          if file "${{ matrix.out }}" | grep -q "dynamically linked"; then
            echo "::error::${{ matrix.out }} 仍是动态链接，静态化失败"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  # --------------------------------------------------------------- 发布
  release:
    name: 发布 Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum lan-share-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lan-share-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
