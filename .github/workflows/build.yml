name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Linux 目标用 zig 交叉编译：zig 自带 musl，-static 出来的二进制拷到
  # OpenWrt（musl 环境）直接可跑，不挑发行版。
  #
  # 不要从 GitHub Release 下 zig —— ziglang 从 0.14 起只把源码包放 GitHub，
  # 预编译二进制只在 ziglang.org，写成
  #   github.com/ziglang/zig/releases/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
  # 会 404。
  ZIG_VERSION: '0.15.1'

jobs:
  # ---------------------------------------------------------------- 功能测试
  test:
    name: 功能测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 前端被编进二进制，必须先生成 web_assets.h，否则编译直接失败
      - name: 生成内嵌前端资源
        run: node tools/embed-web.js

      - name: 编译
        run: cc -O2 -std=c99 -Wall -o lan-share lan_share.c

      - name: 检查可执行文件
        run: |
          ./lan-share -h || true
          ls -la lan-share

      # 测试脚本会自己拉起服务、跑完 79 项断言再关掉它
      - name: 运行端到端测试
        env:
          SPAWN: ./lan-share -p 8080 -d ./uploads -w ./public
          BASE: http://127.0.0.1:8080
          TRAVERSAL_PROBE: lan_share.c
        run: node test.js

      # 路由器上通常只有二进制一个文件，旁边没有 public/。
      # 前端必须已经编进去，否则打开页面就是 404 Not Found。
      # p2p-pump.js 也要在：app.js 顶层就解构 LSPump，缺了它整个页面直接白屏。
      - name: 单文件可用性（无 public 目录也能打开页面）
        run: |
          set -e
          ./lan-share -p 8097 -d ./uploads-solo -w ./no-such-dir >/dev/null 2>&1 &
          SRV=$!
          code=000; pump=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/ || echo 000)
            [ "$code" = "200" ] && break
            sleep 0.3
          done
          pump=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/p2p-pump.js || echo 000)
          kill $SRV 2>/dev/null || true
          echo "无 public 目录时 GET / -> $code, /p2p-pump.js -> $pump"
          if [ "$code" != "200" ] || [ "$pump" != "200" ]; then
            echo "::error::内嵌前端未生效，只拷二进制到路由器会打不开页面"
            exit 1
          fi

  # ------------------------------------------------------------ 多平台编译
  build:
    name: 编译 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux_amd64
            os: ubuntu-latest
            kind: zig
            target: x86_64-linux-musl
            out: lan-share-linux-amd64

          - name: linux_arm64
            os: ubuntu-latest
            kind: zig
            target: aarch64-linux-musl
            out: lan-share-linux-arm64

          # OpenWrt 32 位 ARM 硬浮点：BCM27xx、i.MX6、大多数现代 ARM 路由器。
          # 与桌面 ARMv8 区分开单独出一份，因为路由器普遍是 32 位 userspace。
          - name: openwrt_armv7l
            os: ubuntu-latest
            kind: zig
            target: arm-linux-musleabihf
            out: lan-share-openwrt-armv7l

          - name: windows_amd64
            os: windows-latest
            kind: msys2
            out: lan-share-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 前端被编进二进制，必须先生成 web_assets.h，否则编译直接失败
      - name: 生成内嵌前端资源
        run: node tools/embed-web.js

      - name: 安装 zig ${{ env.ZIG_VERSION }}
        if: matrix.kind == 'zig'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL --max-time 300 -o zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar xf zig.tar.xz
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: 安装 MinGW (Windows)
        if: matrix.kind == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: false

      - name: 编译 (Windows)
        if: matrix.kind == 'msys2'
        shell: msys2 {0}
        run: |
          gcc -Os -std=c99 -Wall -static \
            -o "${{ matrix.out }}" lan_share.c -lws2_32
          file "${{ matrix.out }}"
          ls -la "${{ matrix.out }}"

      # 只编译不运行，等于没测。这里把刚编出来的 exe 真跑一遍，
      # 确认拷到一台干净机器上（没有 public/）打开就是页面而不是 404。
      - name: 实机冒烟 (Windows)
        if: matrix.kind == 'msys2'
        shell: pwsh
        run: |
          $exe = "${{ matrix.out }}"
          $p = Start-Process -FilePath ".\$exe" -ArgumentList "-p","8098","-d",".\uploads-solo","-w",".\no-such-dir" -PassThru -WindowStyle Hidden
          $code = '000'
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 300
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8098/" -UseBasicParsing -TimeoutSec 3
              $code = [string]([int]$r.StatusCode)
              if ($code -eq '200') { break }
            } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host "Windows 产物 GET / -> $code"
          if ($code -ne '200') {
            Write-Host "::error::$exe 跑不起来或打不开页面"
            exit 1
          }

      - name: 编译 (Linux / OpenWrt，zig + musl 静态)
        if: matrix.kind == 'zig'
        run: |
          set -e
          zig version
          zig cc -target "${{ matrix.target }}" -static -Os -std=c99 -Wall \
            -o "${{ matrix.out }}" lan_share.c
          file "${{ matrix.out }}" 2>/dev/null || true
          ls -la "${{ matrix.out }}"
          # 静态产物不应再依赖动态链接器，否则拷到 OpenWrt 上跑不起来
          if file "${{ matrix.out }}" | grep -q "dynamically linked"; then
            echo "::error::${{ matrix.out }} 仍是动态链接，静态化失败"
            exit 1
          fi

      # 路由器 ARM/MIPS 没法在 x86 Runner 上直接跑，用 qemu-user 把刚编出来的
      # 二进制真跑一遍：起服务、请求首页和 /api/info，确认它不是"能编译但不能运行"。
      - name: 实机冒烟 (Linux / 路由器目标，qemu)
        if: matrix.kind == 'zig'
        run: |
          set -e
          BIN="./${{ matrix.out }}"
          case "${{ matrix.target }}" in
            x86_64-linux-musl)    RUNNER="" ;;
            aarch64-linux-musl)   sudo apt-get update -qq
                                  sudo apt-get install -y -qq qemu-user-static
                                  RUNNER="qemu-aarch64-static" ;;
            arm-linux-musleabihf) sudo apt-get update -qq
                                  sudo apt-get install -y -qq qemu-user-static
                                  RUNNER="qemu-arm-static" ;;
            *) echo "::error::未覆盖的 target"; exit 1 ;;
          esac
          $RUNNER "$BIN" -p 8098 -d ./uploads-qemu -w ./no-such-dir >/dev/null 2>&1 &
          SRV=$!
          code=000; info=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8098/ || echo 000)
            [ "$code" = "200" ] && break
            sleep 0.3
          done
          info=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8098/api/info || echo 000)
          kill $SRV 2>/dev/null || true
          echo "${{ matrix.out }} 在 ${RUNNER:-native} 下: GET / -> $code, /api/info -> $info"
          if [ "$code" != "200" ] || [ "$info" != "200" ]; then
            echo "::error::${{ matrix.out }} 交叉编译产物跑不起来"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  # ----------------------------------------- 真实双机（netns 模拟两设备直连）T1
  two-host-lan:
    name: 两主机 LAN（netns 真实 IP 直连）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成内嵌前端资源
        run: node tools/embed-web.js

      - name: 编译
        run: cc -O2 -std=c99 -Wall -o lan-share lan_share.c

      - name: 安装 / 定位 Chrome
        run: |
          set -e
          if ! command -v google-chrome-stable >/dev/null 2>&1; then
            cd "$RUNNER_TEMP"
            curl -fsSL --max-time 300 -o chrome.deb \
              "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
            sudo apt-get install -y -qq ./chrome.deb
          fi
          FOUND=""
          for c in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then FOUND=$(command -v "$c"); break; fi
          done
          if [ -z "$FOUND" ]; then echo "::error::Chrome 装上了但不在 PATH 里"; exit 1; fi
          export CHROME_PATH="$FOUND"
          echo "CHROME_PATH=$FOUND" >> "$GITHUB_ENV"
          "$FOUND" --version

      # netns 搭建 + 浏览器测试需要 root。注意：sudo 默认会把 PATH 重置为
      # secure_path，不含 setup-node 装的 node，所以用 `env PATH="$PATH"` 把当前
      # （含 node）的 PATH 透传进去；CHROME_PATH 经 sudo -E 透传。
      - name: netns 两机直连 + 浏览器 e2e（T1，吞吐下限 8MB/s）
        run: |
          set -e
          sudo -E env PATH="$PATH" bash -c '
            set -e
            export CHROME_PATH="$CHROME_PATH"
            COTURN=0 bash tools/ci-realnet.sh setup
            set -a; . ./realnet.env; set +a
            ./lan-share -p "$SERVER_PORT" -d ./uploads -w ./public >/tmp/lanshare.log 2>&1 &
            SRV=$!
            sleep 1
            # 服务端可达性自检：从两个 ns 各探一次，路由接错立刻现形
            ip netns exec nsA curl -sf -o /dev/null --max-time 5 "http://$GW_A:$SERVER_PORT/" \
              && echo "nsA 可达服务端 OK" || { echo "::error::nsA 不可达服务端"; kill $SRV 2>/dev/null; exit 1; }
            ip netns exec nsB curl -sf -o /dev/null --max-time 5 "http://$GW_B:$SERVER_PORT/" \
              && echo "nsB 可达服务端 OK" || { echo "::error::nsB 不可达服务端"; kill $SRV 2>/dev/null; exit 1; }
            node tools/p2p-e2e.js --server-url "$SERVER_URL_A" \
              --server-url-b "$SERVER_URL_B" \
              --chrome-wrap-a "$WRAP_A" --chrome-wrap-b "$WRAP_B" \
              --devtools-host-a "$DEVTOOLS_A" --devtools-host-b "$DEVTOOLS_B" \
              --devtools-port-a "$DEVTOOLS_PORT_A" --devtools-port-b "$DEVTOOLS_PORT_B" \
              --file-mb 64 --timeout 240 --label ci-lan --throughput-floor 8
            kill $SRV 2>/dev/null || true
          '

  # -------------------------- 真实双机 + AP 隔离 + TURN 中继（关键闸门）T2
  isolated-relay:
    name: AP 隔离 + TURN 中继（必须走中继）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成内嵌前端资源
        run: node tools/embed-web.js

      - name: 编译
        run: cc -O2 -std=c99 -Wall -o lan-share lan_share.c

      - name: 安装 / 定位 Chrome
        run: |
          set -e
          if ! command -v google-chrome-stable >/dev/null 2>&1; then
            cd "$RUNNER_TEMP"
            curl -fsSL --max-time 300 -o chrome.deb \
              "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
            sudo apt-get install -y -qq ./chrome.deb
          fi
          FOUND=""
          for c in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then FOUND=$(command -v "$c"); break; fi
          done
          if [ -z "$FOUND" ]; then echo "::error::Chrome 装上了但不在 PATH 里"; exit 1; fi
          export CHROME_PATH="$FOUND"
          echo "CHROME_PATH=$FOUND" >> "$GITHUB_ENV"
          "$FOUND" --version

      # 隔离 + 起 coturn；服务端按 LAN_SHARE_TURN 把 TURN 注入页面。
      # 直连被 DROP，连接必须经由中继成功建立并完整传文件（吞吐下限 4MB/s）。
      - name: netns 隔离 + TURN 中继 + 浏览器 e2e（T2，关键闸门）
        run: |
          set -e
          sudo -E env PATH="$PATH" bash -c '
            set -e
            export CHROME_PATH="$CHROME_PATH"
            COTURN=1 bash tools/ci-realnet.sh setup isolate
            set -a; . ./realnet.env; set +a
            LAN_SHARE_TURN="$LAN_SHARE_TURN" ./lan-share -p "$SERVER_PORT" -d ./uploads -w ./public >/tmp/lanshare.log 2>&1 &
            SRV=$!
            sleep 1
            # 服务端可达性自检：隔离下每个 ns 只能到自己的网关，这也是预期路径
            ip netns exec nsA curl -sf -o /dev/null --max-time 5 "http://$GW_A:$SERVER_PORT/" \
              && echo "nsA 可达服务端 OK" || { echo "::error::nsA 不可达服务端"; kill $SRV 2>/dev/null; exit 1; }
            ip netns exec nsB curl -sf -o /dev/null --max-time 5 "http://$GW_B:$SERVER_PORT/" \
              && echo "nsB 可达服务端 OK" || { echo "::error::nsB 不可达服务端"; kill $SRV 2>/dev/null; exit 1; }
            node tools/p2p-e2e.js --server-url "$SERVER_URL_A" \
              --server-url-b "$SERVER_URL_B" \
              --chrome-wrap-a "$WRAP_A" --chrome-wrap-b "$WRAP_B" \
              --devtools-host-a "$DEVTOOLS_A" --devtools-host-b "$DEVTOOLS_B" \
              --devtools-port-a "$DEVTOOLS_PORT_A" --devtools-port-b "$DEVTOOLS_PORT_B" \
              --file-mb 64 --timeout 240 --label ci-isorel --throughput-floor 4
            kill $SRV 2>/dev/null || true
          '

  # --------------------------------------------------------------- 发布
  release:
    name: 发布 Release
    needs: [test, build, two-host-lan, isolated-relay]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum lan-share-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lan-share-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
