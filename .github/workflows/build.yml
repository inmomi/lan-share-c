name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Linux 目标用 zig 交叉编译：zig 自带 musl，-static 出来的二进制拷到
  # OpenWrt（musl 环境）直接可跑，不挑发行版。
  #
  # 不要从 GitHub Release 下 zig —— ziglang 从 0.14 起只把源码包放 GitHub，
  # 预编译二进制只在 ziglang.org，写成
  #   github.com/ziglang/zig/releases/download/0.15.1/zig-x86_64-linux-0.15.1.tar.xz
  # 会 404。
  ZIG_VERSION: '0.15.1'

jobs:
  # ---------------------------------------------------------------- 功能测试
  test:
    name: 功能测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 只跑 ubuntu。macOS 那一档不是刚需：功能测试用的是纯 POSIX 接口，
        # 与 linux 完全同源，而 mac 的 runner 排队时间常常比整个测试本身还长，
        # 结果就是发布一直被一个"排不上的 job"卡住（发版 job 在 needs 里等它）。
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 前端被编进二进制，必须先生成 web_assets.h，否则编译直接失败
      - name: 生成内嵌前端资源
        run: node tools/embed-web.js

      - name: 编译
        run: cc -O2 -std=c99 -Wall -o lan-share lan_share.c

      - name: 检查可执行文件
        run: |
          ./lan-share -h || true
          ls -la lan-share

      # 测试脚本会自己拉起服务、跑完 135 项断言再关掉它
      - name: 运行端到端测试
        env:
          SPAWN: ./lan-share -p 8080 -d ./uploads -w ./public
          BASE: http://127.0.0.1:8080
          TRAVERSAL_PROBE: lan_share.c
        run: node test.js

      # 兜底通道（WebSocket 中转）单测：帧格式 / 分块上限 / 背压窗口。
      # 这些边界靠真机点文件点不出来——尤其是"单帧超过服务端 64KB 上限会被
      # 整帧丢弃"这一条，现场只会表现为进度条卡死且没有任何报错。
      - name: 兜底通道单测（relay-channel）
        run: node tools/test-relay.js

      # 路由器上通常只有二进制一个文件，旁边没有 public/。
      # 前端必须已经编进去，否则打开页面就是 404 Not Found。
      # p2p-pump.js 也要在：app.js 顶层就解构 LSPump，缺了它整个页面直接白屏。
      - name: 单文件可用性（无 public 目录也能打开页面）
        run: |
          set -e
          ./lan-share -p 8097 -d ./uploads-solo -w ./no-such-dir >/dev/null 2>&1 &
          SRV=$!
          code=000; pump=000; relay=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/ || echo 000)
            [ "$code" = "200" ] && break
            sleep 0.3
          done
          pump=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/p2p-pump.js || echo 000)
          relay=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/relay-channel.js || echo 000)
          kill $SRV 2>/dev/null || true
          echo "无 public 目录时 GET / -> $code, /p2p-pump.js -> $pump, /relay-channel.js -> $relay"
          if [ "$code" != "200" ] || [ "$pump" != "200" ] || [ "$relay" != "200" ]; then
            echo "::error::内嵌前端未生效，只拷二进制到路由器会打不开页面"
            exit 1
          fi

  # ------------------------------------------------------------ 多平台编译
  build:
    name: 编译 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux_amd64
            os: ubuntu-latest
            kind: zig
            target: x86_64-linux-musl
            out: lan-share-linux-amd64

          - name: linux_arm64
            os: ubuntu-latest
            kind: zig
            target: aarch64-linux-musl
            out: lan-share-linux-arm64

          # OpenWrt 32 位 ARM 硬浮点：BCM27xx、i.MX6、大多数现代 ARM 路由器。
          # 与桌面 ARMv8 区分开单独出一份，因为路由器普遍是 32 位 userspace。
          - name: openwrt_armv7l
            os: ubuntu-latest
            kind: zig
            target: arm-linux-musleabihf
            out: lan-share-openwrt-armv7l

          - name: windows_amd64
            os: windows-latest
            kind: msys2
            out: lan-share-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 前端被编进二进制，必须先生成 web_assets.h，否则编译直接失败
      - name: 生成内嵌前端资源
        run: node tools/embed-web.js

      - name: 安装 zig ${{ env.ZIG_VERSION }}
        if: matrix.kind == 'zig'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL --max-time 300 -o zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar xf zig.tar.xz
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: 安装 MinGW (Windows)
        if: matrix.kind == 'msys2'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          update: false

      - name: 编译 (Windows)
        if: matrix.kind == 'msys2'
        shell: msys2 {0}
        run: |
          gcc -Os -std=c99 -Wall -static \
            -o "${{ matrix.out }}" lan_share.c -lws2_32
          file "${{ matrix.out }}"
          ls -la "${{ matrix.out }}"

      # 只编译不运行，等于没测。这里把刚编出来的 exe 真跑一遍，
      # 确认拷到一台干净机器上（没有 public/）打开就是页面而不是 404。
      - name: 实机冒烟 (Windows)
        if: matrix.kind == 'msys2'
        shell: pwsh
        run: |
          $exe = "${{ matrix.out }}"
          $p = Start-Process -FilePath ".\$exe" -ArgumentList "-p","8098","-d",".\uploads-solo","-w",".\no-such-dir" -PassThru -WindowStyle Hidden
          $code = '000'
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 300
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8098/" -UseBasicParsing -TimeoutSec 3
              $code = [string]([int]$r.StatusCode)
              if ($code -eq '200') { break }
            } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host "Windows 产物 GET / -> $code"
          if ($code -ne '200') {
            Write-Host "::error::$exe 跑不起来或打不开页面"
            exit 1
          }

      - name: 编译 (Linux / OpenWrt，zig + musl 静态)
        if: matrix.kind == 'zig'
        run: |
          set -e
          zig version
          zig cc -target "${{ matrix.target }}" -static -Os -std=c99 -Wall \
            -o "${{ matrix.out }}" lan_share.c
          file "${{ matrix.out }}" 2>/dev/null || true
          ls -la "${{ matrix.out }}"
          # 静态产物不应再依赖动态链接器，否则拷到 OpenWrt 上跑不起来
          if file "${{ matrix.out }}" | grep -q "dynamically linked"; then
            echo "::error::${{ matrix.out }} 仍是动态链接，静态化失败"
            exit 1
          fi

      # 路由器 ARM/MIPS 没法在 x86 Runner 上直接跑，用 qemu-user 把刚编出来的
      # 二进制真跑一遍：起服务、请求首页和 /api/info，确认它不是"能编译但不能运行"。
      - name: 实机冒烟 (Linux / 路由器目标，qemu)
        if: matrix.kind == 'zig'
        run: |
          set -e
          BIN="./${{ matrix.out }}"
          case "${{ matrix.target }}" in
            x86_64-linux-musl)    RUNNER="" ;;
            aarch64-linux-musl)   sudo apt-get update -qq
                                  sudo apt-get install -y -qq qemu-user-static
                                  RUNNER="qemu-aarch64-static" ;;
            arm-linux-musleabihf) sudo apt-get update -qq
                                  sudo apt-get install -y -qq qemu-user-static
                                  RUNNER="qemu-arm-static" ;;
            *) echo "::error::未覆盖的 target"; exit 1 ;;
          esac
          $RUNNER "$BIN" -p 8098 -d ./uploads-qemu -w ./no-such-dir >/dev/null 2>&1 &
          SRV=$!
          code=000; info=000
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8098/ || echo 000)
            [ "$code" = "200" ] && break
            sleep 0.3
          done
          info=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8098/api/info || echo 000)
          kill $SRV 2>/dev/null || true
          echo "${{ matrix.out }} 在 ${RUNNER:-native} 下: GET / -> $code, /api/info -> $info"
          if [ "$code" != "200" ] || [ "$info" != "200" ]; then
            echo "::error::${{ matrix.out }} 交叉编译产物跑不起来"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  # ----------------------------------------- 真实双机（netns 模拟两设备直连）T1
  two-host-lan:
    name: 两主机 LAN（netns 真实 IP 直连）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成内嵌前端资源
        run: node tools/embed-web.js

      - name: 编译
        run: cc -O2 -std=c99 -Wall -o lan-share lan_share.c

      - name: 安装 / 定位 Chrome
        run: |
          set -e
          if ! command -v google-chrome-stable >/dev/null 2>&1; then
            cd "$RUNNER_TEMP"
            curl -fsSL --max-time 300 -o chrome.deb \
              "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
            sudo apt-get install -y -qq ./chrome.deb
          fi
          FOUND=""
          for c in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then FOUND=$(command -v "$c"); break; fi
          done
          if [ -z "$FOUND" ]; then echo "::error::Chrome 装上了但不在 PATH 里"; exit 1; fi
          export CHROME_PATH="$FOUND"
          echo "CHROME_PATH=$FOUND" >> "$GITHUB_ENV"
          "$FOUND" --version

      # netns 搭建 + 浏览器测试需要 root。注意：sudo 默认会把 PATH 重置为
      # secure_path，不含 setup-node 装的 node，所以用 `env PATH="$PATH"` 把当前
      # （含 node）的 PATH 透传进去；CHROME_PATH 经 sudo -E 透传。
      # --no-mdns-bypass：按真实浏览器的默认行为跑（开 mDNS 候选伪装）。
      # 之前测试一直关着它，等于把真机上最常见的故障机制屏蔽掉——同一路由器
      # 同 SSID 的两台设备能看到对方却建不起直连，就是 mDNS 解析不出来。
      # 开着它还能直连，靠的是服务端自带的局域网 STUN 给的 srflx 真实 IP 候选
      # （日志里会打出"链路诊断: host↔srflx"）。
      #
      # 吞吐下限按这一档实测基线定（6MB/s）：开 mDNS 之后候选要等 mDNS 解析
      # 超时、ICE 收敛更慢，CI 这台 2 核 VM 上同时跑两个 Chrome 时端到端约
      # 9MB/s；关着 mDNS 的老基线是 22MB/s。两者不是同一个场景，不要拿老数字
      # 当这条用例的合格线，也不要把它当成产品回退。
      - name: netns 两机直连 + 浏览器 e2e（T1，吞吐下限 6MB/s，必须走直连）
        run: |
          set -e
          sudo -E env PATH="$PATH" bash -c '
            set -e
            export CHROME_PATH="$CHROME_PATH"
            COTURN=0 bash tools/ci-realnet.sh setup
            set -a; . ./realnet.env; set +a
            ./lan-share -p "$SERVER_PORT" -d ./uploads -w ./public >/tmp/lanshare.log 2>&1 &
            SRV=$!
            sleep 1
            # 服务端可达性自检：从两个 ns 各探一次，路由接错立刻现形
            ip netns exec nsA curl -sf -o /dev/null --max-time 5 "http://$GW_A:$SERVER_PORT/" \
              && echo "nsA 可达服务端 OK" || { echo "::error::nsA 不可达服务端"; kill $SRV 2>/dev/null; exit 1; }
            ip netns exec nsB curl -sf -o /dev/null --max-time 5 "http://$GW_B:$SERVER_PORT/" \
              && echo "nsB 可达服务端 OK" || { echo "::error::nsB 不可达服务端"; kill $SRV 2>/dev/null; exit 1; }
            node tools/p2p-e2e.js --server-url "$SERVER_URL_A" \
              --server-url-b "$SERVER_URL_B" \
              --chrome-wrap-a "$WRAP_A" --chrome-wrap-b "$WRAP_B" \
              --devtools-host-a "$DEVTOOLS_A" --devtools-host-b "$DEVTOOLS_B" \
              --devtools-port-a "$DEVTOOLS_PORT_A" --devtools-port-b "$DEVTOOLS_PORT_B" \
              --no-mdns-bypass --require-mode p2p \
              --file-mb 64 --timeout 240 --label ci-lan --throughput-floor 6
            kill $SRV 2>/dev/null || true
          '

  # -------------------------- 真实双机 + AP 隔离 + TURN 中继（关键闸门）T2
  isolated-relay:
    name: AP 隔离 + TURN 中继（必须走中继）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成内嵌前端资源
        run: node tools/embed-web.js

      - name: 编译
        run: cc -O2 -std=c99 -Wall -o lan-share lan_share.c

      - name: 安装 / 定位 Chrome
        run: |
          set -e
          if ! command -v google-chrome-stable >/dev/null 2>&1; then
            cd "$RUNNER_TEMP"
            curl -fsSL --max-time 300 -o chrome.deb \
              "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
            sudo apt-get install -y -qq ./chrome.deb
          fi
          FOUND=""
          for c in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then FOUND=$(command -v "$c"); break; fi
          done
          if [ -z "$FOUND" ]; then echo "::error::Chrome 装上了但不在 PATH 里"; exit 1; fi
          export CHROME_PATH="$FOUND"
          echo "CHROME_PATH=$FOUND" >> "$GITHUB_ENV"
          "$FOUND" --version

      # 隔离 + 起 coturn；服务端按 LAN_SHARE_TURN 把 TURN 注入页面。
      # 直连被 DROP，连接必须经由中继成功建立并完整传文件（吞吐下限 4MB/s）。
      - name: netns 隔离 + TURN 中继 + 浏览器 e2e（T2，关键闸门）
        run: |
          set -e
          sudo -E env PATH="$PATH" bash -c '
            set -e
            export CHROME_PATH="$CHROME_PATH"
            COTURN=1 bash tools/ci-realnet.sh setup isolate
            set -a; . ./realnet.env; set +a
            LAN_SHARE_TURN="$LAN_SHARE_TURN" ./lan-share -p "$SERVER_PORT" -d ./uploads -w ./public >/tmp/lanshare.log 2>&1 &
            SRV=$!
            sleep 1
            # 服务端可达性自检：隔离下每个 ns 只能到自己的网关，这也是预期路径
            ip netns exec nsA curl -sf -o /dev/null --max-time 5 "http://$GW_A:$SERVER_PORT/" \
              && echo "nsA 可达服务端 OK" || { echo "::error::nsA 不可达服务端"; kill $SRV 2>/dev/null; exit 1; }
            ip netns exec nsB curl -sf -o /dev/null --max-time 5 "http://$GW_B:$SERVER_PORT/" \
              && echo "nsB 可达服务端 OK" || { echo "::error::nsB 不可达服务端"; kill $SRV 2>/dev/null; exit 1; }
            # 先看服务端到底把什么发给了浏览器：TURN 注入生没生效，一眼可见。
            # 页面里 window.__LAN_SHARE_TURN__ 一直是 null，靠这里定位是
            # "服务端没拿到环境变量" 还是 "拿到了但替换没命中"。必须放在 e2e
            # 之前——set -e 下 e2e 一失败就退出了，放后面永远打不出来。
            # 注意：整个脚本被包在 bash -c '...' 里，里面绝对不能用单引号，
            # 否则会提前闭合外层引号（第一次就是这么打歪的）。一律用双引号。
            echo "---- 服务端返回首页：占位符是否还在 / 是否已注入 TURN ----"
            ip netns exec nsA curl -s "http://$GW_A:$SERVER_PORT/" > /tmp/served-index.html
            wc -c < /tmp/served-index.html
            grep -c "TURN_CONFIG" /tmp/served-index.html || echo "(首页已无 TURN_CONFIG 占位符，说明替换过)"
            grep -o "turn:[^\"]*" /tmp/served-index.html | head -2 || echo "(首页里没有 turn: URL)"
            grep -o "window.__LAN_SHARE_TURN__.\{0,90\}" /tmp/served-index.html || echo "(没抓到赋值语句)"
            echo "---- 服务端启动日志 /tmp/lanshare.log ----"
            head -25 /tmp/lanshare.log 2>/dev/null || true
            node tools/p2p-e2e.js --server-url "$SERVER_URL_A" \
              --server-url-b "$SERVER_URL_B" \
              --chrome-wrap-a "$WRAP_A" --chrome-wrap-b "$WRAP_B" \
              --devtools-host-a "$DEVTOOLS_A" --devtools-host-b "$DEVTOOLS_B" \
              --devtools-port-a "$DEVTOOLS_PORT_A" --devtools-port-b "$DEVTOOLS_PORT_B" \
              --require-mode p2p \
              --file-mb 64 --timeout 240 --label ci-isorel --throughput-floor 4
            kill $SRV 2>/dev/null || true
          '

  # ---------------------------- 直连彻底不可用 → WebSocket 兜底（T3，保底闸门）
  # 禁掉两子网之间的 UDP，同时开着 mDNS 伪装：ICE 无论有多少候选都不可能建起来。
  # 这一档回答的是"最坏情况下还能不能传"——信令是 TCP，兜底通道走同一条链，
  # 所以必须仍然能把文件完整传到、且字节校验一致。少了这一档，前面几档全绿
  # 也可能只是"恰好这条网能直连"。
  relay-fallback:
    name: 直连不可用 → WebSocket 兜底（必须仍能传）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成内嵌前端资源
        run: node tools/embed-web.js

      - name: 编译
        run: cc -O2 -std=c99 -Wall -o lan-share lan_share.c

      - name: 安装 / 定位 Chrome
        run: |
          set -e
          if ! command -v google-chrome-stable >/dev/null 2>&1; then
            cd "$RUNNER_TEMP"
            curl -fsSL --max-time 300 -o chrome.deb \
              "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
            sudo apt-get install -y -qq ./chrome.deb
          fi
          FOUND=""
          for c in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then FOUND=$(command -v "$c"); break; fi
          done
          if [ -z "$FOUND" ]; then echo "::error::Chrome 装上了但不在 PATH 里"; exit 1; fi
          export CHROME_PATH="$FOUND"
          echo "CHROME_PATH=$FOUND" >> "$GITHUB_ENV"
          "$FOUND" --version

      - name: 禁 UDP + 开 mDNS 伪装，验证兜底通道（T3，下限 2MB/s）
        run: |
          set -e
          sudo -E env PATH="$PATH" bash -c '
            set -e
            export CHROME_PATH="$CHROME_PATH"
            COTURN=0 bash tools/ci-realnet.sh setup noudp
            set -a; . ./realnet.env; set +a
            ./lan-share -p "$SERVER_PORT" -d ./uploads -w ./public >/tmp/lanshare.log 2>&1 &
            SRV=$!
            sleep 1
            ip netns exec nsA curl -sf -o /dev/null --max-time 5 "http://$GW_A:$SERVER_PORT/" \
              && echo "nsA 可达服务端 OK" || { echo "::error::nsA 不可达服务端"; kill $SRV 2>/dev/null; exit 1; }
            ip netns exec nsB curl -sf -o /dev/null --max-time 5 "http://$GW_B:$SERVER_PORT/" \
              && echo "nsB 可达服务端 OK" || { echo "::error::nsB 不可达服务端"; kill $SRV 2>/dev/null; exit 1; }
            # UDP 必须真的被禁掉，否则这一档就退化成普通直连用例。
            # 不能用 echo > /dev/udp/... 去探：UDP 无连接，写出去永远"成功"，
            # 探了也是假通过（第一次就是这么骗过自己的）。直接查规则在不在。
            if iptables -C FORWARD -s "$SUBNET_A" -d "$SUBNET_B" -p udp -j DROP 2>/dev/null \
               && iptables -C FORWARD -s "$SUBNET_B" -d "$SUBNET_A" -p udp -j DROP 2>/dev/null; then
              echo "UDP 已禁：FORWARD 链上两子网间 UDP DROP 规则在位（符合预期）"
            else
              echo "::error::UDP 未被禁掉，本用例失去意义"
              kill $SRV 2>/dev/null; exit 1
            fi
            echo "---- 服务端启动日志 ----"
            head -20 /tmp/lanshare.log 2>/dev/null || true
            # 必须临时关掉 set -e：否则 e2e 一失败脚本立刻退出，下面这些
            # 诊断永远打不出来，就只能靠猜。
            set +e
            node tools/p2p-e2e.js --server-url "$SERVER_URL_A" \
              --server-url-b "$SERVER_URL_B" \
              --chrome-wrap-a "$WRAP_A" --chrome-wrap-b "$WRAP_B" \
              --devtools-host-a "$DEVTOOLS_A" --devtools-host-b "$DEVTOOLS_B" \
              --devtools-port-a "$DEVTOOLS_PORT_A" --devtools-port-b "$DEVTOOLS_PORT_B" \
              --no-mdns-bypass --require-mode relay \
              --file-mb 32 --timeout 300 --label ci-fallback --throughput-floor 2
            RC=$?
            set -e
            echo "---- e2e 退出码 $RC ----"
            echo "---- 服务端还活着吗 ----"
            if pgrep -f "lan-share -p" >/dev/null; then echo "服务端仍在运行"; else echo "服务端已退出（崩溃或被杀）"; fi
            echo "---- 服务端日志尾部 ----"
            tail -40 /tmp/lanshare.log 2>/dev/null || true
            kill $SRV 2>/dev/null || true
            exit $RC
          '

  # --------------------------------------------------------------- 发布
  release:
    name: 发布 Release
    needs: [test, build, two-host-lan, isolated-relay, relay-fallback]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum lan-share-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: artifacts/SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/lan-share-*
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
