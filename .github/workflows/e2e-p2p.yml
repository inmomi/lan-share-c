name: P2P 真实浏览器端到端

# 前面所有测试要么是假 DataChannel 在 Node 里跑 pacing 逻辑，要么是服务端
# HTTP 接口——都验证不了"真实 Chrome 的 SCTP 到底能跑多快"，而这正是用户
# 遇到的问题：同一对设备 SMB 30MB/s，点对点只有 5.8MB/s。
# 这个工作流在 Runner 上拉起两个真实 Chrome（各自独立进程、独立 profile），
# 让它们互相发现，然后：
#   1. TCP 基线：同机服务端上传/下载，作为对照；
#   2. 内置 speedP2p：冷/热各跑一次，报链路诊断（候选对类型、RTT）；
#   3. 真实文件传输（默认 64MB）：自动点确认框、等下载落盘、逐字节 SHA-256
#      校验——并行分段拼回去只要错一段，这里就会现形。
#
# Runner 上的 Chrome 走的是真实内核 loopback（候选对 127.0.0.1 或本机网卡
# host↔host），没有开发机沙箱那套虚拟网络的干扰，数字才是可用的。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  p2p-e2e:
    name: 双 Chrome 真实传输 (${{ matrix.file-mb }}MB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 64MB 看稳态吞吐；16MB 看冷启动（连接刚建好时的爬坡）。
        file-mb: [64, 16]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 前端被编进二进制，必须先生成 web_assets.h，否则编译直接失败
      - name: 生成内嵌前端资源
        run: node tools/embed-web.js

      - name: 编译
        run: cc -O2 -std=c99 -Wall -o lan-share lan_share.c

      # ubuntu-24.04 镜像不再预装 Chrome，直接下官方 .deb 用 apt 装
      # （apt 会自动补依赖）。已有 Chrome 的镜像跳过这步。
      # 注意：$GITHUB_ENV 要等本步骤结束才被 runner 读取，当前 shell 里
      # 读不到它，所以先落到局部变量再写进去。
      - name: 安装 / 定位 Chrome
        run: |
          set -e
          if ! command -v google-chrome-stable >/dev/null 2>&1; then
            cd "$RUNNER_TEMP"
            curl -fsSL --max-time 300 -o chrome.deb \
              "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb"
            sudo apt-get install -y -qq ./chrome.deb
          fi
          FOUND=""
          for c in google-chrome-stable google-chrome chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then
              FOUND=$(command -v "$c")
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::Chrome 装上了但不在 PATH 里"
            exit 1
          fi
          echo "CHROME_PATH=$FOUND" >> "$GITHUB_ENV"
          "$FOUND" --version

      - name: P2P 端到端（TCP 基线 + 冷/热测速 + 真实文件 + 逐字节校验）
        run: node tools/p2p-e2e.js --server ./lan-share --file-mb ${{ matrix.file-mb }} --timeout 240 --label ci-${{ matrix.file-mb }}mb
